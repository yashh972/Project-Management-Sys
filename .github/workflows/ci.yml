name: CI

on: [push, pull_request]

jobs:
  ci:
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
        db: ["mysql", "sqlite"]
        intl: [true]
        experimental: [false]
        include:
          - php: "8.1"
            db: "sqlite"
            intl: true
            experimental: true
          - php: "8.5"
            db: "sqlite"
            intl: false
            experimental: false
          - php: "8.6"
            db: "sqlite"
            intl: true
            experimental: true

    name: PHP ${{ matrix.php }} + ${{ matrix.db }}${{ !matrix.intl && ' (no intl)' || '' }}

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: phproject
        ports:
          - 3306/tcp
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ !matrix.intl && ':intl' || '' }}

      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        env:
          cache-name: cache-composer
        with:
          path: ~/.composer
          key: ${{ runner.os }}-ci-${{ env.cache-name }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-ci-${{ env.cache-name }}-
            ${{ runner.os }}-ci-${{ env.cache-name }}-
            ${{ runner.os }}-ci-

      - name: Syntax check
        run: if find . -name "*.php" ! -path "./vendor/*" ! -path "./ml-service/*" -exec php -l {} 2>&1 \; | grep "syntax error, unexpected"; then exit 1; fi

      - name: Composer
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - run: vendor/bin/phpcs

      - run: vendor/bin/phpstan

      - if: matrix.db == 'mysql'
        name: Install Phproject (MySQL)
        run: php install.php --site-name=Test --site-url=http://localhost/ --timezone=America/Phoenix --admin-username=test --admin-email=test@example.com --admin-password=secret --db-host=127.0.0.1 --db-port=${{ job.services.mysql.ports['3306'] }} --db-user=root

      - if: matrix.db == 'sqlite'
        name: Install Phproject (SQLite)
        run: php install.php --site-name=Test --site-url=http://localhost/ --timezone=America/Phoenix --admin-username=test --admin-email=test@example.com --admin-password=secret --db-engine=sqlite --db-name=database.sqlite

      - name: Test
        run: vendor/bin/phpunit --no-progress

  ml:
    runs-on: ubuntu-24.04
    name: ML service (Python)

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        working-directory: ml-service
        run: pip install -r requirements-dev.txt

      - name: Lint
        working-directory: ml-service
        run: ruff check app tests

      - name: Test
        working-directory: ml-service
        run: pytest -q

  docker:
    runs-on: ubuntu-24.04
    name: Docker build

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build application image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: app
          push: false
          tags: agile-codeboard:ci

      - name: Build ML image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ml-service/Dockerfile
          push: false
          tags: agile-codeboard-ml:ci
