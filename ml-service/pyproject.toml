[project]
name = "phproject-ml"
version = "0.1.0"
description = "Inference and forecasting service for the Agile CodeBoard project intelligence layer"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
