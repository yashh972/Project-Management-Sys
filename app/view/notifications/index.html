<!DOCTYPE html>
<html lang="{{ @this->lang() }}">
<head>
    <include href="blocks/head.html" />
</head>
<body class="notifications-page">
<set fullwidth="{{ true }}" />
<include href="blocks/navbar.html" />

<div class="container notifications-page-wrap">
    <div class="notifications-head">
        <div>
            <h1>Notifications</h1>
            <p class="text-muted">Updates on issues you watch or own.</p>
        </div>
        <check if="{{ @notifications }}">
            <button type="button" class="btn btn-default btn-sm" id="notifications-mark-all">
                <span class="fa fa-check"></span> Mark all read
            </button>
        </check>
    </div>

    <check if="{{ @notifications }}">
        <div class="notification-list">
            <repeat group="{{ @notifications }}" value="{{ @item }}">
                <a class="notification-item {{ @item.read_date ? '' : 'unread' }}"
                   href="{{ @BASE }}{{ @item.url }}"
                   data-notification-id="{{ @item.id }}">
                    <span class="notification-dot" aria-hidden="true"></span>
                    <span class="notification-body">
                        <span class="notification-message">{{ @item.message | esc }}</span>
                        <span class="notification-meta">
                            <check if="{{ @item.actor_name }}">{{ @item.actor_name | esc }} &middot; </check>
                            {{ $this->formatDateTime($this->utc2local(strtotime(@item.created_date))) }}
                        </span>
                    </span>
                </a>
            </repeat>
        </div>
    </check>
    <check if="{{ !@notifications }}">
        <div class="notifications-empty">
            <span class="fa fa-bell-o"></span>
            <h3>You're all caught up</h3>
            <p class="text-muted">Notifications appear here when someone updates an issue you watch or own.</p>
        </div>
    </check>

    <include href="blocks/footer.html" />
</div>
</body>
</html>
