<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="{{ @site.description | esc }}">
<meta name="application-name" content="{{ @site.name | esc }}">
<meta name="csrf-token" content="{{ @csrf_token | esc }}">
<title>{{ empty(@title) ? @site.name : @title . ' - ' . @site.name | esc }}</title>
<check if="{{ empty(@user.theme) && strpos(@site.theme, 'phproject.css') !== false }}">
    <true>
        <link rel="stylesheet" href="{{ @BASE }}/{{ @site.theme }}">
    </true>
    <false>
        <link rel="stylesheet" href="{{ @BASE }}/{{ empty(@user.theme) ? @site.theme : @user.theme }}">
    </false>
</check>
<link rel="stylesheet" href="{{ @BASE }}/css/style.css">
<link rel="stylesheet" href="{{ @BASE }}/css/datepicker3.min.css">
<link rel="stylesheet" href="{{ @BASE }}/css/font-awesome.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;650&display=swap">
<link rel="stylesheet" href="{{ @BASE }}/css/modern.css">
<link rel="stylesheet" href="{{ @BASE }}/css/tailwind.css">
<link rel="stylesheet" href="{{ @BASE }}/css/intelligence.css">
<link rel="icon" type="image/svg+xml" href="{{ @BASE }}/img/logo.svg">
<link rel="search" type="application/opensearchdescription+xml" href="{{ @BASE }}/opensearch.xml" title="{{ @site.name | esc }}">
